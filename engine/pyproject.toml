[project]
name = "omnivoice-engine"
version = "0.0.0"
description = "OmniVoice ses ve yapay zeka motoru"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # Ses yakalama — PortAudio tekerlekleriyle gelir, ayrı kurulum gerekmez.
    "sounddevice>=0.5",
    "numpy>=2.0",
    # FLAC kodlama: 16 kHz mono WAV dakikada 1,9 MB tutuyor ve sağlayıcı
    # sınırı 25 MB; FLAC kayıpsız olarak bunu ikiye katlıyor.
    "soundfile>=0.13",
    # WASAPI loopback (sistem sesi kaydı). `sounddevice` loopback bayrağını
    # dışarı açmıyor; `soundcard` kendi WASAPI bağlarını taşıdığı için
    # PortAudio ile çakışmadan yan yana çalışıyor.
    "soundcard>=0.4; sys_platform == 'win32'",
    # Windows tümleşikliği: pano, pencere odağı, süreç adı.
    "pywin32>=306; sys_platform == 'win32'",
    "psutil>=6.0",
    # API Kasası — Windows Credential Manager arka ucu.
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
omnivoice-engine = "omnivoice_engine.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["omnivoice_engine*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
